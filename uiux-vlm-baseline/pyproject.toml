[project]
name = "uiux-vlm-baseline"
version = "0.1.0"
description = "Synthetic UI/UX VLM benchmark baselines on RTX 4090"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate>=1.12.0",
  "bitsandbytes>=0.48.0",
  "datasets>=4.4.0",
  "pandas>=2.3.0",
  "pillow>=12.0.0",
  "qwen-vl-utils>=0.0.14",
  "torch==2.9.1",
  "torchvision>=0.24.1",
  "transformers>=4.57.0",
  "tqdm>=4.67.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" },
]
torchvision = [
  { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
