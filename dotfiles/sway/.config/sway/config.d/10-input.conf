# Input — kanata + Space Cadet XKB.
#
# The keymap is applied to type:keyboard rather than to kanata's virtual device
# specifically, and that is deliberate: if kanata dies or is stopped, the raw
# keyboard keeps the Space Cadet map, so Mod3 (RALT) bindings keep working and
# you are not locked out of the WM.
#
# Sway applies input config to devices as they appear, including hotplugged and
# recreated ones. That is why there is no equivalent of the X11
# reload-spacecadet-xkb.sh hook here — kanata recreating its uinput device on
# restart needs no re-apply.
#
# xkb_file must be an absolute path; sway does not expand ~ here.
#
# This points at the FLATTENED keymap, not the source one, deliberately.
#
# The source ~/.config/xkb/keymap/spacecadet.xkb is seven lines of `include'
# directives that libxkbcommon resolves against its default include path — which
# it derives from $XDG_CONFIG_HOME, falling back to $HOME. Measured behaviour:
#
#   env -i HOME=/home/tay  xkbcli compile-keymap --keymap <source>  -> exit 0
#   env -i                 xkbcli compile-keymap --keymap <source>  -> exit 1
#   env -i XDG_CONFIG_HOME=/nonexistent ...                         -> exit 1
#
# So the source keymap silently falls back to a default US layout in any session
# whose environment doesn't resolve those paths, and when that happens Mod3
# stops being RALT — which looks exactly like
# "the mod key doesn't work".
#
# spacecadet.resolved.xkb is the fully expanded 2473-line keymap: zero includes,
# compiles with `env -i' and no environment whatsoever. Regenerate it after any
# change to the manna-cadet submodule:
#
#   xkbcli compile-keymap --keymap ~/.config/xkb/keymap/spacecadet.xkb \
#     > ~/src/dotfiles/sway/.config/sway/spacecadet.resolved.xkb

input type:keyboard {
    xkb_file /home/tay/.config/sway/spacecadet.resolved.xkb

    # These match the X server's autorepeat defaults, which is what the
    # StumpWM session ran (it made no xset calls) and what typing on this
    # keyboard is calibrated to.
    #
    # An earlier revision used 250 ms / 40 per sec. That was far too eager:
    # ordinary key dwell on a Kinesis with homerow mods routinely passes
    # 250 ms, and once repeat starts at 40/sec a character lands every 25 ms —
    # so a single keystroke came out as two or three. It also stacks badly with
    # kanata's `tap-hold-release 200 200': a key held long enough to resolve
    # tap-vs-hold is already most of the way to the repeat threshold.
    repeat_delay 660
    repeat_rate 25
}

# `flat' is deliberate: a strict 1:1 mapping from device movement to pixels with
# NO acceleration curve, so pointer speed never depends on how fast you flick.
#
# The mistake in an earlier revision was pairing it with `pointer_accel 0'.
# Under the flat profile that constant is a LINEAR SPEED MULTIPLIER over the
# range -1 .. 1, and 0 means literally unscaled — which on a 5120px-wide output
# is a lot of desk per screen crossing. Flat was right; the speed was not.
#
# 0.5 keeps the profile flat and roughly halves the hand movement needed. Tune
# it live, no restart:
#
#     swaymsg input type:pointer pointer_accel 0.7
#
# then write the value you settle on back here. Raise toward 1 for faster,
# toward 0 for the old 1:1 behaviour.
input type:pointer {
    accel_profile flat
    pointer_accel 0.5
}

# StumpWM had *mouse-focus-policy* :click.
focus_follows_mouse no
mouse_warping none
