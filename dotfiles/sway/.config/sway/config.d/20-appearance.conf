# Appearance — a direct port of the StumpWM colours and border style.
#
# StumpWM equivalents:
#   *normal-border-width* 1        -> default_border pixel 1
#   (set-focus-color   "#00aa00")  -> client.focused
#   (set-unfocus-color "#333333")  -> client.unfocused
#   (set-win-bg-color  "#000000")  -> background field
#
# Fidelity gap: StumpWM distinguished floating focus (#aa00aa) from tiled focus
# (#00aa00). Sway has no separate floating border colour, so #aa00aa is reused
# for urgent instead.

default_border pixel 2
default_floating_border pixel 2
smart_borders no
gaps inner 0

font pango:unscii 16px

# The INDICATOR column is the split-direction hint. Sway draws it on the edge
# where the next window will open, so after `splith' it lights the RIGHT edge
# and after `splitv' the BOTTOM edge. That is the i3 behaviour you remember.
#
# It only works if the indicator differs from the border colour — an earlier
# revision had both as #00aa00, which made it invisible and split direction
# unreadable. Amber #aa5500 is the modeline accent, so it reads as deliberate.
#
# Border is 2px rather than StumpWM's 1px purely so the indicator is legible;
# a single pixel of amber on a 5120px-wide display is not.

# class                 border  backgr. text    indicator child_border
client.focused          #00aa00 #000000 #aaaaaa #aa5500   #00aa00
client.focused_inactive #333333 #000000 #888888 #333333   #333333
client.unfocused        #333333 #000000 #888888 #333333   #333333
client.urgent           #aa00aa #000000 #ffffff #aa00aa   #aa00aa
client.background       #000000

# NOTE: default_orientation does far less than its name suggests. It is a
# one-shot decision at WORKSPACE creation based on the OUTPUT's aspect ratio; it
# never adapts per split. On a 5120x1440 panel it returns horizontal forever.
# The thing that actually re-splits by container ratio is autotiling, started in
# 70-autostart.conf. Setting this is harmless but nearly pointless here.
default_orientation auto
