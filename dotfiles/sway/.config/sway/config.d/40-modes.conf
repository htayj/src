# Modes — just the stock resize mode, as sway ships it.
#
# Previous revisions had a StumpWM-style `stump' prefix map on $mod+x plus an
# `mpd' and a `session' mode. Those are gone: standard i3 bindings are the goal,
# and a prefix map you have to remember is the opposite of that.
#
# What the prefix map used to reach, and where it went:
#   exit            -> $mod+Shift+e (stock i3, with a swaynag confirmation)
#   lock            -> $mod+Shift+x
#   screenshot      -> Print
#   window switcher -> `sway-window-switcher' on PATH; bind it if you want it
#   ssh / web / imdb prompts -> `sway-ssh-prompt', `sway-web-prompt',
#                               `sway-web-search' on PATH, unbound
#   mpd             -> `mpc' directly, or the bar's click handlers
#
# The scripts all still exist and work; they just are not bound to a prefix.

bindsym --to-code $mod+r mode "resize"

mode "resize" {
    bindsym --to-code $left  resize shrink width  10px
    bindsym --to-code $down  resize grow   height 10px
    bindsym --to-code $up    resize shrink height 10px
    bindsym --to-code $right resize grow   width  10px

    bindsym Left  resize shrink width  10px
    bindsym Down  resize grow   height 10px
    bindsym Up    resize shrink height 10px
    bindsym Right resize grow   width  10px

    bindsym Return mode "default"
    bindsym Escape mode "default"
}
