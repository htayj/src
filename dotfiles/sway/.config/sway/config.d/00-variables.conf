# Variables.
#
# $mod is Mod3. On this keymap Mod3 is <RALT>, which kanata emits when you HOLD
# either big thumb key (@Hro = tap Backspace, @Hsp = tap Space). It is the same
# physical key StumpWM's `A-' prefix uses.
#
# Modifier slots on this machine (see sway-plan.md §1.4):
#   Mod1  <LALT>  Meta_L   — hold homerow s / l   — EMACS META, NEVER BIND
#   Mod2  <RWIN>  Hyper_L  — hold Esc / '         — free (spare tier)
#   Mod3  <RALT>  Alt_L    — hold either thumb    — $mod
#   Mod4  <LWIN>  Super_L  — hold homerow a / ;   — application shortcuts
#   Mod5  <ZEHA>  Level3   — hold thumb Delete    — GREEK LAYER, NEVER BIND

set $mod  Mod3

set $left  h
set $down  j
set $up    k
set $right l

set $term  ghostty
set $menu  fuzzel
set $lock  swaylock -f
