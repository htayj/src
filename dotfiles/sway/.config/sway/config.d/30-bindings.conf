# Bindings — sway's shipped defaults (i.e. the i3 way), verbatim.
#
# An earlier revision buried things behind a StumpWM-style `$mod+x' prefix map.
# That was over-fitting: standard i3 muscle memory is the whole point, so this
# file now mirrors /etc/sway/config exactly, with only $term and $menu swapped
# for the local choices. Anything NOT in sway's defaults is confined to the
# clearly marked EXTRAS section at the bottom.
#
# EVERY binding uses --to-code. This is not stylistic: this keymap has a second
# XKB group (the Top/math layer on Mode_switch), so when group 2 is active the
# keysym at the physical `h' position is no longer `h'. --to-code resolves the
# keysym to a KEYCODE using the first layout, binding the physical position.
# Without it, bindings silently stop matching in group 2.
#
# Reminder: $mod is Mod3, held on EITHER big thumb key. So "$mod+d" is
# hold-thumb + d. "$mod+BackSpace" would be unusable — Backspace IS the left
# thumb key — but nothing below needs it.

# --- basics ------------------------------------------------------------------
bindsym --to-code $mod+Return   exec $term
bindsym --to-code $mod+Shift+q  kill
bindsym --to-code $mod+d        exec $menu

floating_modifier $mod normal

bindsym --to-code $mod+Shift+c  reload
bindsym --to-code $mod+Shift+e  exec swaynag -t warning \
    -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' \
    -B 'Yes, exit sway' 'swaymsg exit'

# --- focus -------------------------------------------------------------------
bindsym --to-code $mod+$left  focus left
bindsym --to-code $mod+$down  focus down
bindsym --to-code $mod+$up    focus up
bindsym --to-code $mod+$right focus right
bindsym $mod+Left  focus left
bindsym $mod+Down  focus down
bindsym $mod+Up    focus up
bindsym $mod+Right focus right

# --- move --------------------------------------------------------------------
bindsym --to-code $mod+Shift+$left  move left
bindsym --to-code $mod+Shift+$down  move down
bindsym --to-code $mod+Shift+$up    move up
bindsym --to-code $mod+Shift+$right move right
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right

# --- workspaces --------------------------------------------------------------
bindsym --to-code $mod+1 workspace number 1
bindsym --to-code $mod+2 workspace number 2
bindsym --to-code $mod+3 workspace number 3
bindsym --to-code $mod+4 workspace number 4
bindsym --to-code $mod+5 workspace number 5
bindsym --to-code $mod+6 workspace number 6
bindsym --to-code $mod+7 workspace number 7
bindsym --to-code $mod+8 workspace number 8
bindsym --to-code $mod+9 workspace number 9
bindsym --to-code $mod+0 workspace number 10

bindsym --to-code $mod+Shift+1 move container to workspace number 1
bindsym --to-code $mod+Shift+2 move container to workspace number 2
bindsym --to-code $mod+Shift+3 move container to workspace number 3
bindsym --to-code $mod+Shift+4 move container to workspace number 4
bindsym --to-code $mod+Shift+5 move container to workspace number 5
bindsym --to-code $mod+Shift+6 move container to workspace number 6
bindsym --to-code $mod+Shift+7 move container to workspace number 7
bindsym --to-code $mod+Shift+8 move container to workspace number 8
bindsym --to-code $mod+Shift+9 move container to workspace number 9
bindsym --to-code $mod+Shift+0 move container to workspace number 10

# --- layout ------------------------------------------------------------------
bindsym --to-code $mod+b splith
bindsym --to-code $mod+v splitv
# Ungroup: `split none' dissolves the parent container when the focused window
# is its only child — it promotes the window one level up and the pointless
# [splith n=1] wrapper disappears. No-op if the container has 2+ children.
#
# Note sway does NOT tidy these up on its own: move the second-to-last window
# out of a container and the n=1 wrapper lingers. That is how invisible
# single-child groups accumulate. Spot them with $mod+t, flatten with this.
bindsym --to-code $mod+g exec sway-ungroup
bindsym --to-code $mod+s layout stacking
bindsym --to-code $mod+w layout tabbed
bindsym --to-code $mod+e layout toggle split
bindsym --to-code $mod+f fullscreen
bindsym --to-code $mod+Shift+space floating toggle
bindsym --to-code $mod+space focus mode_toggle
# Ascend / descend the container tree. `focus parent' selects the enclosing
# split container and DRAWS ITS BORDER — the built-in way to see the extent of
# an otherwise invisible group. `focus child' is its inverse: sway's own
# command, just unbound in the stock config.
bindsym --to-code $mod+a focus parent
bindsym --to-code $mod+z focus child

# --- scratchpad --------------------------------------------------------------
bindsym --to-code $mod+Shift+minus move scratchpad
bindsym --to-code $mod+minus       scratchpad show

# =============================================================================
# EXTRAS — not in sway's defaults. Everything above this line is stock i3.
# =============================================================================

# Live container-tree view. i3/sway never draw the split containers holding
# your windows, so nesting is invisible; this prints the actual hierarchy and
# redraws on every window event.
bindsym --to-code $mod+t exec sway-tree --toggle

# Keybinding cheatsheet, generated from this config so it cannot drift.
# $mod+? — i.e. hold a thumb and press Shift+/.
bindsym --to-code $mod+Shift+slash exec sway-keys

# Screen lock.
bindsym --to-code $mod+Shift+x exec $lock

# Screenshot a region, save to ~/Pictures/Screenshots, copy the PATH (not the
# image) to the clipboard — the behaviour the old StumpWM binding had.
bindsym Print exec sway-screenshot

# Media keys. swayosd rather than bare pactl so there is an on-screen indicator;
# --locked matters, or these die the moment swaylock is up.
bindsym --locked XF86AudioRaiseVolume exec swayosd-client --output-volume raise
bindsym --locked XF86AudioLowerVolume exec swayosd-client --output-volume lower
bindsym --locked XF86AudioMute        exec swayosd-client --output-volume mute-toggle
bindsym --locked XF86AudioMicMute     exec swayosd-client --input-volume mute-toggle
bindsym --locked XF86AudioPlay  exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioNext  exec playerctl next
bindsym --locked XF86AudioPrev  exec playerctl previous
