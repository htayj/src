# Bar — waybar, launched in place of swaybar.
#
# `swaybar_command waybar' is the documented way to substitute a bar: sway still
# owns the bar's lifecycle (start, restart on reload) but runs waybar instead of
# its own swaybar binary.
#
# WHY NOT swaybar. An earlier revision used it, on the reasoning that it ports
# the StumpWM modeline more directly, has a tray, and needs no extra package.
# That was wrong on one concrete point: swaybar loads tray icons through
# gdk-pixbuf, and librsvg has removed its gdk-pixbuf loader module upstream, so
# on this system gdk-pixbuf cannot decode SVG at all. swaybar can therefore only
# render PNG tray icons — and every current icon theme is SVG-only:
#
#     breeze-dark   png=0      svg=19827
#     Qogir         png=0      svg=29926
#     elementary    png=0      svg=3566
#     hicolor       png=977    svg=385     <- the only PNG source left
#
# Result: any tray app whose icon has no PNG in hicolor renders as swaybar's
# missing-icon glyph, a red frowny face. udiskie's
# `drive-removable-media-usb-pendrive' has no PNG anywhere on the system.
#
# waybar is GTK3 and loads all of those SVGs (verified with
# Gtk.IconTheme.load_icon). Hence the switch. Config lives in ~/.config/waybar/,
# shipped by this package.
#
# To fall back to swaybar, comment out swaybar_command and restore the
# status_command/colors/tray block from git history — but expect the frowny.

bar {
    swaybar_command waybar
}
