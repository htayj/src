# Autostart.
#
# The systemd/dbus environment import is NOT here — Arch ships it in
# /etc/sway/config.d/50-systemd-user.conf, which the top-level config includes.
# Duplicating it would just race.

# sway-session.target ships in the sway-contrib package at
# /usr/lib/systemd/user/sway-session.target. Starting it lights up anything with
# WantedBy=sway-session.target (kanshi) and, via BindsTo=graphical-session.target,
# anything keyed off graphical-session.
exec_always systemctl --user start sway-session.target

# --- idle and lock -----------------------------------------------------------
# The 600s blank is the OLED burn-in mitigation, and it is the ONLY such
# mitigation available: neither sway nor wlroots has pixel shift, orbiting, or
# static-content dimming, and nothing is planned. Use `output * power off', not
# `disable' — disable tears down the output and loses its workspaces.
exec_always pkill -x swayidle; exec swayidle -w \
    timeout 300  'swaylock -f' \
    timeout 600  'swaymsg "output * power off"' \
    resume       'swaymsg "output * power on"' \
    before-sleep 'swaylock -f'

# --- notifications -----------------------------------------------------------
# mako IS D-Bus activatable, but it must still be started explicitly, because
# THREE packages ship a service file claiming org.freedesktop.Notifications:
#
#   fr.emersion.mako.service                    -> /usr/bin/mako
#   org.kde.plasma.Notifications.service        -> plasma_waitforname ...
#   org.xfce.xfce4-notifyd.Notifications.service-> /usr/lib/xfce4/notifyd/xfce4-notifyd
#
# Which one D-Bus activates is not something you want to leave to chance: if
# the KDE one wins it blocks waiting for a plasmashell that will never appear,
# and if the XFCE one wins its popups render as ordinary floating windows
# instead of layer-shell notifications. Starting mako here makes it claim the
# name first and settles the race.
exec mako

# Bluetooth connect/disconnect notifications. blueman-applet used to provide
# these; it is gone (see below), so this watches BlueZ over D-Bus directly.
exec sway-bluetooth-notify

# --- no tray applets ----------------------------------------------------------
# nm-applet, blueman-applet and udiskie used to run here. They are gone: all
# three are X11-era GTK applets whose dbusmenu menus are exactly what makes a
# tray "feel X11", and waybar reads NetworkManager, BlueZ and PipeWire over
# D-Bus directly (see ~/.config/waybar/config.jsonc).
#
# That also removes the --indicator / --appindicator flag hacks those two needed
# to avoid rendering as invisible Gtk.StatusIcon widgets, and the dependence on
# an icon having a PNG in hicolor.
#
# udiskie still does the actual automounting — just without a tray icon.
exec udiskie --no-tray

# The daemons themselves are still required, they simply have no GUI frontend
# in the bar: NetworkManager and bluetooth.service are system units, and
# PipeWire/WirePlumber are user units. Nothing to start here.

# xembedsniproxy republishes XEmbed-only tray icons as SNI. Ships in
# plasma-workspace (already installed), so it costs nothing to enable — but it
# is DISABLED because nothing on this machine needs it: every tray app in use
# (nm-applet, udiskie, blueman) speaks SNI natively.
#
# It is also a known source of exactly the kind of tray weirdness worth avoiding
# while bringing the session up: it screen-scrapes X pixmaps, so icons can come
# out black or garbled, and it spawns an invisible helper window at 0,0 that
# some compositors render as a dark rectangle.
#
# Enable it only if a specific legacy app's icon fails to appear at all.
# exec xembedsniproxy

# --- polkit ------------------------------------------------------------------
# polkit-kde-agent is a plain binary, not a plasmoid, so it works standalone.
exec /usr/lib/polkit-kde-authentication-agent-1

# --- volume/caps OSD ---------------------------------------------------------
exec swayosd-server

# --- clipboard ---------------------------------------------------------------
# Do NOT add wl-clip-persist alongside cliphist — they race, producing duplicate
# entries and randomly-failing copies. cliphist already persists what it stores.
exec wl-paste --type text  --watch cliphist store
exec wl-paste --type image --watch cliphist store

# --- dynamic split direction -------------------------------------------------
# Required on a 32:9 panel: default_orientation only decides a workspace's
# INITIAL layout from the monitor aspect ratio and never adapts, so without this
# every split after the first few produces absurdly wide slivers.
#
# --limit 2 approximates a master-stack layout and is the documented escape
# hatch for autotiling's known conflict with stacked/tabbed containers (its own
# README disclaims that interaction as unfixable). If you commit fully to the
# frame workflow, either drop this line or scope it with --workspaces.
exec_always pkill -x autotiling; exec autotiling --limit 2
