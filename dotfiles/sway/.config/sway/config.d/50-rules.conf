# Window rules.

# Idle inhibition needs no daemon for the common case — sway has it built in.
# Modes: focus | fullscreen | open | visible | none.
# Firefox and mpv also speak idle-inhibit-unstable-v1 natively.
for_window [app_id="mpv"]     inhibit_idle fullscreen
for_window [app_id="firefox"] inhibit_idle fullscreen
for_window [class="steam"]    inhibit_idle focus
for_window [class="gamescope"] inhibit_idle focus

# Dialogs and pickers float, matching StumpWM's :center gravity for transients.
for_window [window_role="pop-up"]      floating enable
for_window [window_role="bubble"]      floating enable
for_window [window_role="dialog"]      floating enable
for_window [window_type="dialog"]      floating enable
for_window [app_id="pavucontrol"]      floating enable, resize set 900 650
for_window [app_id="blueman-manager"]  floating enable, resize set 900 650
for_window [app_id="nm-connection-editor"] floating enable, resize set 800 600

# waybar's network module opens nmtui in a throwaway terminal. ghostty's `class'
# config key sets the Wayland app_id, and it must be a valid GTK application ID
# (reverse-DNS), hence the long name.
for_window [app_id="com.mitchellh.ghostty.nmtui"] floating enable, resize set 900 600
for_window [app_id="com.mitchellh.ghostty.tree"]  floating enable, resize set 620 780, move position 40 60
for_window [title="^Picture-in-Picture$"] floating enable, sticky enable

# XWayland stragglers that mis-size themselves on a 5120x1440 output.
for_window [class="^.*"] title_format "%title"

# max_render_time: the per-window value has NO effect unless the per-output
# value is also set (see host-basedserv.conf). Both are left off by default —
# tune only if you actually want the latency, starting at 1 and incrementing
# until frame drops stop. Budget is 4.17ms at 240Hz.
# for_window [app_id="^.*"] max_render_time 1
