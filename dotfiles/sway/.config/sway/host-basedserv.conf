# Per-host fragment: basedserv.
#
# Reached via ~/.config/sway/host.conf, a symlink refreshed by
# ~/.local/bin/sway-session before it execs sway.
#
# Geometry mirrors x11/.screenlayout/g9andcrt.sh: the small panel sits BELOW the
# G9 and horizontally inset, not beside it. Non-overlapping.
#
#   x=0                                              x=5120
#    +----------------------------------------------+  y=0
#    |          DP-1 — Samsung Odyssey G95SC         |
#    |               5120 x 1440 @ 240               |
#    +----------------------------------------------+  y=1440
#                               +--------+
#                               | HDMI   |  800x600 at x=4200
#                               +--------+  y=2040
#
# Note X11 named these DP-0 / HDMI-0; the kernel/Wayland names are DP-1 /
# HDMI-A-1. Confirm with `swaymsg -t get_outputs'.

output DP-1 {
    mode 5120x1440@240Hz
    position 0 0
    scale 1
    background #000000 solid_color

    # VRR stays OFF. sway's own VRR-setups wiki has ~30 entries: almost all AMD,
    # roughly half reporting flicker, and ZERO NVIDIA. The Arch Wiki states
    # Wayland VRR is supported on "Plasma and Sway (no Nvidia)". Ultrawide OLED
    # is the worst-supported intersection of all — both such entries report
    # flicker. If you ever want it, the effective lever is an EDID override
    # narrowing the panel's VRR range, not a sway setting.
    adaptive_sync off

    # Trades compositing headroom for latency. Budget at 240Hz is 4.17ms, so a
    # value at or above that is meaningless. `max_render_time auto' does not
    # exist in any release. Tune by starting at 1 and incrementing until frame
    # drops stop; the per-window value in 50-rules.conf does nothing unless this
    # one is set.
    max_render_time off
}

output HDMI-A-1 {
    mode 800x600
    position 4200 1440
    scale 1
    background #000000 solid_color
}

# Workspace placement: keep the small panel for glanceable things only.
workspace 1 output DP-1
workspace 2 output DP-1
workspace 3 output DP-1
workspace 4 output DP-1
workspace 5 output DP-1
workspace 10 output HDMI-A-1
