# fuzzel — replaces the native StumpWM app-launcher, including its
# most-recently-used ordering (fuzzel caches launches in ~/.cache/fuzzel).
#
# fuzzel takes a FONTCONFIG PATTERN here, not a file path. An earlier revision
# used the absolute .otf path, borrowing a startup-latency trick from tofi — it
# silently fell back to Noto Sans, verified with:
#     fc-match /usr/share/fonts/OTF/unscii-16-full.otf  ->  Noto Sans
#     fc-match unscii                                   ->  unscii-16-full.otf
font=unscii:pixelsize=16
dpi-aware=no
lines=20
width=60
horizontal-pad=12
vertical-pad=8
inner-pad=4
prompt=": "

[colors]
background=000000f0
text=aaaaaaff
match=00aa00ff
selection=333333ff
selection-text=ffffffff
selection-match=00aa00ff
border=aa5500ff

[border]
width=1
radius=0
