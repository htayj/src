# User MPD configuration.  The packaged user service runs `mpd --systemd`,
# which reads this XDG config instead of the system-wide /etc/mpd.conf.

music_directory         "~/Music"
playlist_directory      "~/.local/share/mpd/playlists"
db_file                 "~/.local/share/mpd/database"
state_file              "~/.local/state/mpd/state"
sticker_file            "~/.local/share/mpd/sticker.sql"

# Log to the user journal when running under systemd.
log_file                "syslog"

bind_to_address         "localhost"
port                    "6600"

auto_update             "yes"
restore_paused          "yes"

# PipeWire provides a PulseAudio-compatible server for this user session.
audio_output {
        type            "pulse"
        name            "PipeWire PulseAudio"
        mixer_type      "software"
}

filesystem_charset      "UTF-8"
