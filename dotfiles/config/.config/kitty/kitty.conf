# Font family and faces are prepended by generated-kitty-config in
# ~/src/guix-config/modules/tay/home-common.scm.
# Match ~/.config/ghostty/config, whose Linux default is 12pt.
font_size 12.0
hide_window_decorations yes

# Ghostty's built-in CGA theme.
foreground #aaaaaa
background #000000
cursor #b8b8b8
cursor_text_color #ffffff
selection_foreground #000000
selection_background #c1deff

color0  #000000
color1  #aa0000
color2  #00aa00
color3  #aa5500
color4  #0d0db7
color5  #aa00aa
color6  #00aaaa
color7  #aaaaaa
color8  #555555
color9  #ff5555
color10 #55ff55
color11 #ffff55
color12 #5555ff
color13 #ff55ff
color14 #55ffff
color15 #ffffff

# X11 distinguishes Meta from Alt, but terminal programs such as Readline,
# Pi, and games expect our Mod1/Meta key to use Alt's terminal encoding.
# Generate exhaustive mappings while preserving Ctrl/Shift/Super/Hyper.
geninclude generate-meta-as-alt.py
