[Service]
# Run Sunshine against an isolated Xvfb + Gamescope virtual display instead of
# capturing or resizing the normal desktop session.
ExecStart=
ExecStart=/home/tay/.local/bin/sunshine-gamescope
Environment=SUNSHINE_GAMESCOPE_WIDTH=1920
Environment=SUNSHINE_GAMESCOPE_HEIGHT=1080
Environment=SUNSHINE_GAMESCOPE_REFRESH=60
Environment=SUNSHINE_XVFB_DISPLAY=:99
Environment=SUNSHINE_GAMESCOPE_INNER_DISPLAY=:1
Environment=SUNSHINE_GAMESCOPE_WAYLAND_DISPLAY=gamescope-0
