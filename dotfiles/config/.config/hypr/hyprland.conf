# Hyprland 0.55 legacy hyprlang configuration for basedbox.
# StumpWM A- is Mod1, supplied by physical RALT in manna-cadet.
# LALT remains Meta/Mod3 for applications; Hyprland's META name means Super.
$mainMod = ALT
$groupMod = SUPER ALT
$terminal = kitty
$fileManager = thunar
$shell = python3 ~/.config/hypr/caelestia-session.py
$menu = $shell ipc drawers toggle launcher

# Match the active X desktop geometry, including the CRT below the ultrawide.
monitor = DP-1, 5120x1440@119.98, 0x0, 1
monitor = HDMI-A-1, 800x600@75, 4200x1440, 1
monitor = , preferred, auto, 1

# No hyprcursor-format theme is installed; Hyprland falls back to this XCursor
# theme (Guix adwaita-icon-theme via XCURSOR_PATH) for itself and clients.
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Kitty's Wayland GLFW otherwise ignores the application's Meta/Mod3 key.
# Applies to newly launched Kitty windows; no keymap change is required.
env = KITTY_WAYLAND_DETECT_MODIFIERS,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Owns only its Caelestia shell, clipboard watcher and polkit agent; exits when this compositor exits.
exec-once = $shell run

# Input and Kanata remain independent of shell/session lifecycle.
input {
    kb_file = ~/.config/xkb/keymap/spacecadet.xkb
    repeat_delay = 660
    repeat_rate = 25
    follow_mouse = 2
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 2
    gaps_out = 5
    border_size = 1
    col.active_border = rgba(9ad6ccff) rgba(e9bd7eff) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

group {
    groupbar {
        font_size = 12
    }
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

# Direct StumpWM-style Alt bindings.
bind = $mainMod, RETURN, exec, $terminal
bindd = $mainMod, SPACE, Launcher, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, V, layoutmsg, togglesplit
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Shell conveniences: keep all terminal/focus/workspace/prefix binds intact.
# bindd descriptions label these rows in the Alt+? help (keybind-help.py).
bindd = $mainMod, D, Dashboard, exec, $shell ipc drawers toggle dashboard
bindd = $mainMod, A, Utilities / quick controls, exec, $shell ipc drawers toggle utilities
bindd = $mainMod, COMMA, Nexus settings, exec, $shell ipc nexus open
bindd = $mainMod, N, Sidebar / notifications, exec, $shell ipc drawers toggle sidebar
bindd = $mainMod SHIFT, V, Clipboard history, exec, $shell clipboard
bindd = $mainMod CTRL, L, Lock screen, exec, $shell lock
bindd = $mainMod, PRINT, Screenshot area, exec, sh ~/.config/hypr/screenshot.sh area
bindd = $mainMod SHIFT, PRINT, Screenshot full desktop, exec, sh ~/.config/hypr/screenshot.sh full
# Real GUI helpers already supplied by the workstation profiles.
bindd = $mainMod SHIFT, A, Audio mixer (pavucontrol), exec, pavucontrol
bindd = $mainMod SHIFT, N, Network connections, exec, nm-connection-editor
bindd = $mainMod SHIFT, E, Screenshots folder, exec, thunar ~/Pictures/Screenshots
# Alt+? (keysym slash + Shift on the manna-cadet AB10 key): toggle binding help.
bindd = $mainMod SHIFT, slash, Keybinding help (this list), exec, python3 ~/.config/hypr/keybind-help.py

# Hyprland groups use Super+Alt, not the application's Meta key.
bind = $groupMod, g, togglegroup,
bind = $groupMod, n, changegroupactive, f
bind = $groupMod, p, changegroupactive, b
bind = $groupMod, h, moveintogroup, l
bind = $groupMod, l, moveintogroup, r
bind = $groupMod, k, moveintogroup, u
bind = $groupMod, j, moveintogroup, d
bind = $groupMod, u, moveoutofgroup,

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# A-x prefix: release Alt, then c/e/k/q. Actions return to the normal map.
bind = $mainMod, x, submap, stumpwm
submap = stumpwm, reset
bind = , c, exec, $terminal
bind = , e, exec, emacs
bind = , k, killactive,
bind = , q, exit,
bindi = , Escape, submap, reset
submap = reset

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

windowrule {
    name = ignore-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = xwayland-drag-helper
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = keybind-help
    match:class = ^hypr-keybind-help$
    float = on
    center = on
    size = (monitor_w*0.5) (monitor_h*0.8)
}
