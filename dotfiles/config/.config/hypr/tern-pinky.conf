# Pinky Super_L is local Mod4/SUPER (source laptop used Mod3).
# The bridge checks focused class; other apps receive their original chord.
bindd = SUPER SHIFT, U, Tern: toggle usage panel (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py SHIFT U
bindd = SUPER SHIFT, A, Tern: new agent tab (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py SHIFT A
bindd = SUPER, H, Tern: previous tab (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py NONE H
bindd = SUPER, L, Tern: next tab (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py NONE L
bindd = SUPER, J, Tern: next session (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py NONE J
bindd = SUPER, K, Tern: previous session (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py NONE K
bindd = SUPER, N, Tern: next pane (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py NONE N
bindd = SUPER, P, Tern: previous pane (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py NONE P
bindd = SUPER CTRL, N, Tern: new note (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py CTRL N
bindd = SUPER CTRL, P, Tern: picture in picture (pinky Super), exec, python3 ~/.config/hypr/tern-pinky.py CTRL P
