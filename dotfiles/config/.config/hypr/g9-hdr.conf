# G9-only settings, managed by g9-hdr-controls. Peak HDR metadata uses EDID.
monitorv2 {
    output = DP-1
    mode = 5120x1440@60
    position = 0x0
    scale = 1
    vrr = 0
    bitdepth = 10
    cm = hdr
    sdr_min_luminance = 0.005
    sdr_max_luminance = 200
    sdrbrightness = 1.2
    sdrsaturation = 1.05
}

# Reload-compatible entrypoint: the running immutable main config sources this
# mutable file. Keep shortcuts in their own include, also on future logins.
source = ~/.config/hypr/tern-pinky.conf
