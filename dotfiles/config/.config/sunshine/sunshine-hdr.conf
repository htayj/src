# Disruptive HDR mode for ~/.local/bin/sunshine-gamescope-hdr.
# This is meant to run from a real TTY with gamescope's DRM backend, not from
# the normal X11 desktop. KMS capture is the Linux path that can carry HDR
# metadata to Moonlight.
capture = kms
encoder = nvenc
system_tray = disabled
file_apps = /home/tay/.config/sunshine/apps-hdr.json
