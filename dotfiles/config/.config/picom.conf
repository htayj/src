# Compositor backend and tearing prevention.
# glx + vsync is the effective anti-tearing pair on this Intel iGPU (i915);
# vsync syncs buffer swaps to the monitor refresh so half-drawn frames are
# never shown.
backend = "glx";
vsync = true;

# Keep fullscreen windows composited so vsync still applies to them.
# By default picom unredirects a fullscreen window (lets it bypass the
# compositor for performance), which reintroduces tearing in fullscreen
# video/games. Set false to keep everything synced. Flip to true (or remove)
# if you want lower-latency, unsynced fullscreen instead.
unredir-if-possible = false;

# Hide windows flagged _NET_WM_STATE_HIDDEN (e.g. scratchpad/minimised).
opacity-rule = [
    "0:_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'"
];
