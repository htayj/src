# basedbox only: owned by home-workstation-configuration.scm, excluded from
# the shared stow `config` package. Never let the graph quantum drop below
# 1024 frames (21.3 ms at 48 kHz); at 256 the DP sink and game/browser streams
# underrun under heavy CPU and memory pressure. Same floor PipeWire applies
# to VMs in its stock context.properties.rules.
#
# module-rt tries the xdg-desktop-portal Realtime interface before RTKit.
# Portal 1.20.3's map_pid fails with ENOTDIR on its pidfd lookup, and
# module-rt then does not fall back, so it retries for about 3 x 25 s and the
# data loop gets no RT priority. Disable the portal path so module-rt talks to
# the system rtkit-service-type (config-k8-plus.scm) directly.
context.properties = {
    default.clock.min-quantum = 1024
    module.rt.args = { rtportal.enabled = false }
}
