# basedbox only: owned by home-workstation-configuration.scm, excluded from
# the shared stow `config` package. Match the graph floor in
# pipewire.conf.d/10-basedbox-min-quantum.conf so PulseAudio clients (games,
# browsers) are not offered smaller buffers than the graph runs. Same value
# PipeWire's stock pulse.properties.rules uses for VMs.
#
# Like pipewire.conf.d/10-basedbox-min-quantum.conf, skip the broken
# xdg-desktop-portal 1.20.3 Realtime path (map_pid pidfd ENOTDIR, no
# fallback) so module-rt asks the system RTKit directly.
context.properties = {
    module.rt.args = { rtportal.enabled = false }
}

pulse.properties = {
    pulse.min.quantum = 1024/48000
}
