[mcp_servers.oracle]
command = "npx"
args = ["-y", "@steipete/oracle", "oracle-mcp"]

[mcp_servers.oracle.tools.consult]
approval_mode = "approve"

[mcp_servers.oracle.tools.sessions]
approval_mode = "approve"

[mcp_servers.gitea]
command = "bash"
args = ["-lc", "source /home/tay/.local/share/private-env.d/gitea-mcp.sh 2>/dev/null || true; exec gitea-mcp -t stdio --host https://git.nogroup.group"]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[model_providers.routebraid-zai]
name = "RouteBraid Z.AI Coding Plan"
base_url = "https://192.168.1.246/v1"
wire_api = "responses"
request_max_retries = 2
stream_max_retries = 1
stream_idle_timeout_ms = 300000

[model_providers.routebraid-zai.auth]
command = "/usr/bin/cat"
args = ["/home/tay/.config/routebraid/stage1-token"]
timeout_ms = 2000
refresh_interval_ms = 0

[features]
memories = true
terminal_resize_reflow = true
hooks = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

